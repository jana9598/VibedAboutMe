<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game | Jana Pohlmann</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>

    <!-- Full Width Top Navigation Bar -->
    <nav class="top-navbar">
        <div class="nav-content">
            <ul class="nav-items">
                <li>
                    <a href="index.html" class="nav-pill">
                        <span aria-hidden="true">🏠</span> Home
                    </a>
                </li>
                <li>
                    <a href="library.html" class="nav-pill">
                        <span aria-hidden="true">📚</span> Library
                    </a>
                </li>
                <li>
                    <a href="game.html" class="nav-pill is-active" aria-current="page">
                        <span aria-hidden="true">🎴</span> Game
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container">

        <!-- Header -->
        <header>
            <h1>Memory Game</h1>
            <p class="tagline">flip the cards · find the pairs</p>
        </header>

        <!-- Memory game -->
        <section id="memory-game" class="memory-section">
            <h2>Find all the pairs</h2>

            <div class="memory-status-bar">
                <p class="memory-stats">
                    <span>Moves: <span id="memory-moves">0</span></span>
                    <span>Pairs: <span id="memory-pairs">0</span>/6</span>
                </p>
                <button type="button" class="tool-btn" id="memory-restart"><span aria-hidden="true">🔄</span> Restart</button>
            </div>

            <ul class="memory-grid" aria-label="Memory game board"></ul>

            <p id="memory-status" class="memory-status" role="status" aria-live="polite"></p>
            <noscript><p class="memory-status">This game needs JavaScript to play.</p></noscript>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>For inquiry 💌, please send a postcard 📮.</p>
    </footer>

</body>
</html>
