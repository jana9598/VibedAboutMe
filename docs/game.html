<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game | Jana Pohlmann</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>

    <!-- Full Width Top Navigation Bar -->
    <nav class="top-navbar">
        <div class="nav-content">
            <ul class="nav-items">
                <li>
                    <a href="index.html" class="nav-pill">
                        <span aria-hidden="true">🏠</span> Home
                    </a>
                </li>
                <li>
                    <a href="library.html" class="cloud-link">
                        <svg class="cloud-svg-bg" viewBox="0 0 120 50" preserveAspectRatio="none" aria-hidden="true">
                            <defs>
                                <linearGradient id="grad-library" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#ff94b7"/>
                                    <stop offset="25%" stop-color="#ffd166"/>
                                    <stop offset="50%" stop-color="#a8ded6"/>
                                    <stop offset="75%" stop-color="#b8c0ff"/>
                                    <stop offset="100%" stop-color="#ff94b7"/>
                                </linearGradient>
                            </defs>
                            <path d="M 22 42 Q 10 42 10 32 Q 10 24 18 20 Q 18 10 30 10 Q 38 10 44 15 Q 52 6 66 8 Q 78 10 82 20 Q 92 18 100 24 Q 108 30 104 38 Q 102 42 92 42 Z" stroke="url(#grad-library)" vector-effect="non-scaling-stroke"/>
                        </svg>
                        <span class="cloud-text"><span aria-hidden="true">📚 </span>Library</span>
                    </a>
                </li>
                <li>
                    <a href="game.html" class="cloud-link is-active" aria-current="page">
                        <svg class="cloud-svg-bg" viewBox="0 0 120 50" preserveAspectRatio="none" aria-hidden="true">
                            <defs>
                                <linearGradient id="grad-game" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#ff94b7"/>
                                    <stop offset="25%" stop-color="#ffd166"/>
                                    <stop offset="50%" stop-color="#a8ded6"/>
                                    <stop offset="75%" stop-color="#b8c0ff"/>
                                    <stop offset="100%" stop-color="#ff94b7"/>
                                </linearGradient>
                            </defs>
                            <path d="M 22 42 Q 10 42 10 32 Q 10 24 18 20 Q 18 10 30 10 Q 38 10 44 15 Q 52 6 66 8 Q 78 10 82 20 Q 92 18 100 24 Q 108 30 104 38 Q 102 42 92 42 Z" stroke="url(#grad-game)" vector-effect="non-scaling-stroke"/>
                        </svg>
                        <span class="cloud-text"><span aria-hidden="true">🎴 </span>Game</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container">

        <!-- Header -->
        <header>
            <h1>Memory Game</h1>
            <p class="tagline">flip the cards · find the pairs</p>
        </header>

        <!-- Memory game -->
        <section id="memory-game" class="memory-section">
            <h2>Find all the pairs</h2>

            <div class="memory-status-bar">
                <p class="memory-stats">
                    <span>Moves: <span id="memory-moves">0</span></span>
                    <span>Pairs: <span id="memory-pairs">0</span>/6</span>
                </p>
                <button type="button" class="tool-btn" id="memory-restart"><span aria-hidden="true">🔄</span> Restart</button>
            </div>

            <ul class="memory-grid" aria-label="Memory game board"></ul>

            <p id="memory-status" class="memory-status" role="status" aria-live="polite"></p>
            <noscript><p class="memory-status">This game needs JavaScript to play.</p></noscript>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>For inquiry 💌, please send a postcard 📮.</p>
    </footer>

</body>
</html>
